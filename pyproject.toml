[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cripto-predictor"
version = "1.2.0rc5"
description = "Portable, fail-closed cryptocurrency research pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.28.1,<1",
  "predictor-core>=3.2.1,<4",
  "predictor-ops>=4.2.2rc1,<5",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "platformdirs>=4.3,<5",
  "pyyaml>=6.0.3,<7",
  "websockets>=15,<17",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0,<2", "openai>=1.0,<3"]
v3 = ["ccxt>=4.4,<5", "hmmlearn>=0.3.3,<1", "numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
excel = ["openpyxl>=3.1.5,<4"]
science = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
test = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "pytest>=8.4,<10", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
cripto-predictor = "GarimpoInvestimentos.cli:main"
cripto-predictor-job = "GarimpoInvestimentos.jobs:main"
cripto-research = "GarimpoInvestimentos.research_runner:main"

[project.entry-points."predictor.plugins"]
cripto = "GarimpoInvestimentos.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["GarimpoInvestimentos"]

[tool.hatch.build.targets.sdist]
include = ["/GarimpoInvestimentos", "/charters", "/observation_plans", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel.force-include]
"charters" = "GarimpoInvestimentos/charters"
"observation_plans" = "GarimpoInvestimentos/observation_plans"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["GarimpoInvestimentos"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["typings", ".venv", "work", "dist", "build", "scripts/forense", "docs/source_archive_20260908/objects", "docs/open_source_research/20260911T0233", "docs/open_source_research/20260911T0525", "docs/evidence/2026-09-24-prompt1"]

[tool.ruff.format]
# Bytes congelados: docs/continuity_20260919/BASELINE_V1.json fixa o sha256 deste
# módulo (measurement_module_sha256). Continua sob `ruff check`.
# scripts/stack_wheels.py: cópia idêntica em todos os consumidores do stack (formatada a 110 colunas no
# ecosystem-predictor-cain); continua sob `ruff check` e pyright.
exclude = ["GarimpoInvestimentos/profit_recovery_v1.py", "scripts/stack_wheels.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501", "E731", "E741", "UP017", "UP031"]

[dependency-groups]
dev = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "pytest>=8.4,<10", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

# predictor-core / predictor-ops: published GitHub Release wheels registered in STACK_WHEELS.json (repository,
# tag, asset, sha256) and fetched into this local flat index by `python scripts/stack_wheels.py fetch` before
# `uv sync --locked` (the producers are private; the fetch verifies the sha256). Never versioned (R01, 2026-10-07).
[[tool.uv.index]]
name = "stack-wheels"
url = ".stack-wheels"
format = "flat"
