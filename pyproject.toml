[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cripto-predictor"
version = "1.0.0"
description = "Portable, fail-closed cryptocurrency research pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.28.1,<1",
  "predictor-core>=2.1.0,<2.2",
  "predictor-ops>=2.0.0,<2.1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
llm = ["google-genai>=1.0,<2", "openai>=1.0,<3"]
v3 = ["ccxt>=4.4,<5", "hmmlearn>=0.3.3,<1", "numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
excel = ["openpyxl>=3.1.5,<4"]
science = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
test = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
cripto-predictor = "GarimpoInvestimentos.cli:main"
cripto-predictor-job = "GarimpoInvestimentos.jobs:main"

[project.entry-points."ecosystem_predictor.plugins"]
cripto = "GarimpoInvestimentos.plugin:PLUGIN"

[tool.hatch.build.targets.wheel]
packages = ["GarimpoInvestimentos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
source = ["GarimpoInvestimentos"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["typings", ".venv", "work", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501", "E731", "E741", "UP017", "UP031"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = [
  "GarimpoInvestimentos/config.py",
  "GarimpoInvestimentos/contracts.py",
  "GarimpoInvestimentos/feature_store_health.py",
  "GarimpoInvestimentos/persistence.py",
  "GarimpoInvestimentos/plugin.py",
  "GarimpoInvestimentos/providers",
  "GarimpoInvestimentos/security",
  "GarimpoInvestimentos/services/inference.py",
]
exclude = ["**/__pycache__"]
stubPath = "typings"

[dependency-groups]
dev = ["build>=1.3,<2", "coverage[toml]>=7.10,<8", "pre-commit>=4.3,<5", "pyright>=1.1.403,<2", "pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[tool.uv.sources]
predictor-core = { path = "wheelhouse/predictor_core-2.1.0-py3-none-any.whl" }
predictor-ops = { path = "wheelhouse/predictor_ops-2.0.0-py3-none-any.whl" }
