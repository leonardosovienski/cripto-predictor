name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  # predictor-core / predictor-ops are GitHub Release assets of private repositories (STACK_WHEELS.json).
  # STACK_READ_TOKEN: fine-grained token, Contents: read on core-predictor and predictor-ops. Without it the
  # fetch step fails closed with the reason; GITHUB_TOKEN cannot read another repository's releases.
  STACK_READ_TOKEN: ${{ secrets.STACK_READ_TOKEN || github.token }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Stack wheels from the registry (GitHub Releases of the private core/ops, sha256-verified)
        run: uv run --no-project python scripts/stack_wheels.py fetch
      - run: uv sync --locked --all-extras
      - run: uv run --no-project python scripts/stack_wheels.py check
      - name: Preserve frozen OSS evidence bytes
        run: git diff --exit-code 39b0f57496cee06e6f8841c2476f8428210aaf76 -- docs/open_source_research/20260911T0233 docs/open_source_research/20260911T0525
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check --diff .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync python scripts/scan_secrets.py .
      - run: uv build
      - name: A published version is immutable (content == release asset, or bump)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/check_release_identity.py --strict
      - run: uv run --no-sync pytest --cov=GarimpoInvestimentos --cov-report=term-missing
      - uses: actions/upload-artifact@v7
        with:
          name: crypto-distributions
          path: dist/*
          if-no-files-found: error
      - name: Contract test installed wheels outside checkout
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/lock-requirements.txt"
          uv run --no-project python scripts/stack_wheels.py requirements --input "$RUNNER_TEMP/lock-requirements.txt" --output "$RUNNER_TEMP/lock-requirements.hashed.txt"
          python -m venv "$RUNNER_TEMP/wheel-contract"
          "$RUNNER_TEMP/wheel-contract/bin/pip" install --require-hashes -r "$RUNNER_TEMP/lock-requirements.hashed.txt"
          "$RUNNER_TEMP/wheel-contract/bin/pip" install --no-deps dist/cripto_predictor-*.whl
          "$RUNNER_TEMP/wheel-contract/bin/pip" check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-contract/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheels.py"

  python-314-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Stack wheels from the registry (GitHub Releases of the private core/ops, sha256-verified)
        run: uv run --no-project python scripts/stack_wheels.py fetch
      - run: uv sync --locked --extra test --extra science
      - run: uv build
      - run: uv run --no-sync pytest -q

  all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Stack wheels from the registry (GitHub Releases of the private core/ops, sha256-verified)
        run: uv run --no-project python scripts/stack_wheels.py fetch
      - run: uv sync --locked --all-extras
      - run: uv run --no-project python scripts/stack_wheels.py check
      - run: uv build
      - run: uv run --no-sync coverage run --rcfile=coverage-runtime.ini -m pytest -q
      - run: uv run --no-sync coverage report --rcfile=coverage-runtime.ini

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
          upload-release-assets: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - name: Stack wheels into the build context (the image installs them from .stack-wheels, no network pin)
        run: uv run --no-project --python 3.13 python scripts/stack_wheels.py fetch
      - run: docker build --tag cripto-predictor:test .
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL cripto-predictor:test --help
      - name: Empty installed store must fail without network
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL \
            --tmpfs /var/lib/cripto-predictor:rw,noexec,nosuid,size=64m,uid=10001,gid=10001 \
            -e GEMINI_API_KEY=test-gemini-key-for-ci-only \
            -e SERP_API_KEY=test-serp-key-for-ci-only -e LLM_PROVIDER=gemini \
            -e GEMINI_MODEL=gemini-2.5-flash \
            cripto-predictor:test --assets bitcoin --no-cache > /tmp/empty-store.txt 2>&1
          status=$?
          set -e
          cat /tmp/empty-store.txt
          test "$status" -eq 1
          grep -F 'Pipeline interrompido' /tmp/empty-store.txt
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cripto-predictor:test
          severity: CRITICAL,HIGH
          exit-code: "1"
