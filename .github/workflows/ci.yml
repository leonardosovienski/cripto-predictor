name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/scan_secrets.py .
      - run: uv build
      - run: uv run pytest --cov=GarimpoInvestimentos --cov-report=term-missing
      - name: Contract test installed wheels outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-contract"
          "$RUNNER_TEMP/wheel-contract/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheel-contract/bin/pip" install \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v3.0.0/predictor_core-3.0.0-py3-none-any.whl" \
            "predictor-ops @ https://github.com/leonardosovienski/predictor-ops/releases/download/v4.0.0/predictor_ops-4.0.0-py3-none-any.whl" \
            dist/cripto_predictor-1.0.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-contract/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheels.py"

  python-314-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv sync --extra test
      - run: uv build
      - run: uv run pytest -q

  all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv build
      - run: uv run coverage run --rcfile=coverage-runtime.ini -m pytest -q
      - run: uv run coverage report --rcfile=coverage-runtime.ini

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
      - run: docker build --tag cripto-predictor:test .
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL cripto-predictor:test --help
      - run: >-
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL
          --tmpfs /var/lib/cripto-predictor:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
          -e GEMINI_API_KEY=test-gemini-key-for-ci-only
          -e SERP_API_KEY=test-serp-key-for-ci-only
          -e LLM_PROVIDER=gemini
          -e GEMINI_MODEL=gemini-2.5-flash
          cripto-predictor:test --assets bitcoin --no-cache
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cripto-predictor:test
          severity: CRITICAL,HIGH
          exit-code: "1"
