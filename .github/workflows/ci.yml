name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra test
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run python scripts/scan_secrets.py .
      - run: uv run pytest --cov=GarimpoInvestimentos --cov-report=term-missing
      - run: uv build
      - name: Contract test installed wheels outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-contract"
          "$RUNNER_TEMP/wheel-contract/bin/pip" install wheelhouse/predictor_core-2.1.0-py3-none-any.whl wheelhouse/predictor_ops-2.0.0-py3-none-any.whl dist/cripto_predictor-1.0.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-contract/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_wheels.py"

  python-314-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --extra test
      - run: uv run pytest -q

  all-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run coverage run --rcfile=coverage-runtime.ini -m pytest -q
      - run: uv run coverage report --rcfile=coverage-runtime.ini

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
      - run: docker build --tag cripto-predictor:test .
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL cripto-predictor:test --help
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cripto-predictor:test
          severity: CRITICAL,HIGH
          exit-code: "1"
