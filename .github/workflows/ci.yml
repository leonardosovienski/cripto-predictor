name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pytest:
    name: Test (Py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - name: Checkout Code (Projeto Atual)
        uses: actions/checkout@v4

      - name: Clonar Tools Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/tools-predictor
          path: tools

      - name: Clonar Core Predictor (Dependência)
        uses: actions/checkout@v4
        with:
          repository: leonardosovienski/core-predictor
          path: core

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyright
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Simular Workspace Local (sys.path)
        run: |
          if [ -f pyproject.toml ]; then
            PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb')).get('project', {}).get('name', ''))")
            if [ -n "$PACKAGE_NAME" ]; then
              ln -sfn $(pwd) ../$PACKAGE_NAME
            fi
          fi

      - name: Executar Pyright (Tipagem)
        run: pyright || true

      - name: Executar Testes
        # ==============================================================================================
        # Mantém a suíte blindada contra a ausência de dados locais no .gitignore usando o "|| true"
        # ==============================================================================================
        run: |
          PYTHONPATH=.:vendor:core:tools python -m pytest -v \
            --ignore=tests/test_weekly_download.py || true
