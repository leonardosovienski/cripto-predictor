version: 2

updates:
  # uv.lock is the canonical resolution; URL-pinned Core/Ops require review.
  - package-ecosystem: "uv"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 5

    # Scientific/runtime dependencies remain individually reviewable.
    groups:
      python-tooling-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "ruff"
          - "pyright"
          - "pytest"
          - "pytest-cov"
          - "coverage"
          - "pre-commit"
          - "build"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "deps"
      include: "scope"

    pull-request-branch-name:
      separator: "/"

  # Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 5

    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "ci"
      include: "scope"

    pull-request-branch-name:
      separator: "/"

  # Imagens base usadas no Dockerfile
  - package-ecosystem: "docker"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Sao_Paulo"

    open-pull-requests-limit: 3

    groups:
      docker-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "docker"
      include: "scope"

    pull-request-branch-name:
      separator: "/"
