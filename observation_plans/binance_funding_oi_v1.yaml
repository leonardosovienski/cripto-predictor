    latency_p50_max_ms: 30000
    latency_p95_max_ms: 60000
    latency_p99_max_ms: 60000
    max_allowed_degraded_events_per_month: 2
    max_unexplained_quarantines: 0
    scheduled_tests: [disconnection, duplicate_response, revision]
