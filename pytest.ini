[pytest]
# testpaths trava a descoberta em tests/. Sem isso, o CI — que faz checkout do
# core-predictor em ./core e do tools-predictor em ./tools — coletava também as
# suítes DESSES repositórios (744 itens em vez de 325), rodando testes que já
# têm CI próprio e que assumem outro sys.path. Mesmo guard já adotado no
# pytest.ini do brasileirao-predictor.
testpaths = tests
python_files = test_*.py
python_functions = test_*
